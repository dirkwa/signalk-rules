# Publish to npm with OIDC-attested provenance on every `v*` tag push.
#
# OIDC trust between this repo and npmjs replaces the long-lived
# NPM_TOKEN secret — the workflow exchanges its short-lived OIDC token
# for an npm publish token at the moment of `npm publish`. The npm CLI
# must be >= 11 for the exchange to actually happen (older CLIs
# silently fall back to anonymous publish, which 404s). Node 22 in
# actions/setup-node@v7 currently ships npm 10.9.x, so we install
# npm@^11 first.
#
# The package.json `repository.url` must match this repo's GitHub URL
# verbatim or the OIDC attestation fails with HTTP 422.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to v11+ (needed for OIDC token exchange)
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Build + lint + test
        run: npm run build:all

      # A tag can point at a version that was already published (e.g.
      # the very first release goes out locally because npm trusted
      # publishing can only be configured on an existing package).
      # Make the tag push a green no-op in that case instead of a
      # confusing red "cannot publish over" failure.
      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "signalk-rules@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "signalk-rules@$VERSION already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
